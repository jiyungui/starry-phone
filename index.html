<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#eeeeee" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="星星机" />

    <title>星星机主屏</title>

    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./styles.css?v=bottom-fix-1" />
  </head>

  <body>
    <main class="phone-shell">
      <!-- 星星机开场动画 -->
      <section
        class="splash-screen"
        id="splashScreen"
        aria-label="星星机启动动画"
      >
        <div class="splash-inner">
          <svg class="splash-logo" viewBox="0 0 120 120" aria-hidden="true">
            <path
              class="star-line"
              d="M60 10
             L72.5 43.5
             L108 45
             L80 67
             L89 102
             L60 82
             L31 102
             L40 67
             L12 45
             L47.5 43.5
             Z"
            />
            <path
              class="star-spark spark-a"
              d="M96 18 L96 31 M89.5 24.5 L102.5 24.5"
            />
            <path
              class="star-spark spark-b"
              d="M25 18 L25 29 M19.5 23.5 L30.5 23.5"
            />
          </svg>

          <div class="splash-title">STARRY PHONE</div>
          <div class="splash-subtitle">XINGXING JI</div>
        </div>
      </section>
      <div class="wallpaper"></div>
      <div class="wallpaper-mask"></div>

      <!-- 星星机激活锁 -->
      <section class="activation-screen" id="activationScreen" hidden>
        <div class="activation-card">
          <svg class="activation-logo" viewBox="0 0 120 120" aria-hidden="true">
            <path
              d="M60 10
           L72.5 43.5
           L108 45
           L80 67
           L89 102
           L60 82
           L31 102
           L40 67
           L12 45
           L47.5 43.5
           Z"
            />
          </svg>

          <h1>STARRY PHONE</h1>
          <p class="activation-desc">请输入星星机激活码</p>

          <input
            id="activationInput"
            class="activation-input"
            type="text"
            placeholder="SX-XXXX-XXXX"
            autocomplete="off"
            spellcheck="false"
          />

          <button id="activationSubmit" class="activation-button">
            激活星星机
          </button>

          <p id="activationMessage" class="activation-message"></p>

          <div class="activation-device">
            <span>设备 ID</span>

            <div class="activation-device-row">
              <code id="activationDeviceId">生成中</code>

              <button
                id="copyDeviceId"
                class="copy-device-button"
                type="button"
                aria-label="复制设备 ID"
              >
                复制
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- 状态栏 -->
      <header class="status-bar">
        <span id="statusTime">09:58</span>
        <div class="status-icons">
          <span class="signal-icon"></span>
          <span>4G</span>
          <span class="battery">90</span>
        </div>
      </header>

      <!-- 主屏 -->
      <section class="home-viewport" id="homeViewport">
        <div class="pages" id="pages">
          <!-- 第一页 -->
          <section class="page page-one" data-page="0">
            <div class="grid">
              <!-- 顶部大组件 -->
              <article
                class="widget hero-widget editable-widget"
                data-widget-id="p1Hero"
                style="grid-column: 1 / 5; grid-row: 1 / 4"
              >
                <div class="hero-top">
                  <div class="pill-line"></div>
                  <div class="soft-cloud"></div>
                </div>

                <div class="avatar-ring">
                  <img data-bind-img="p1Hero" alt="" />
                </div>

                <div class="widget-title hero-name" data-bind-title="p1Hero">
                  未设置
                </div>
                <div
                  class="widget-subtitle hero-subtitle"
                  data-bind-subtitle="p1Hero"
                >
                  未设置
                </div>
                <p class="widget-text hero-text" data-bind-text="p1Hero">
                  未设置
                </p>
              </article>

              <!-- 左下中组件 -->
              <article
                class="widget mini-card editable-widget"
                data-widget-id="p1Mini"
                style="grid-column: 1 / 3; grid-row: 4 / 6"
              >
                <div class="small-avatar">
                  <img data-bind-img="p1Mini" alt="" />
                </div>
                <h3 data-bind-title="p1Mini">未设置</h3>
                <p data-bind-text="p1Mini">未设置</p>
                <div class="soft-line"></div>
              </article>

              <!-- 第一页四个小方形图片组件 -->
              <article
                class="widget image-square image-only-widget"
                data-widget-id="p1SquareA"
                style="grid-column: 3 / 4; grid-row: 4 / 5"
              >
                <img data-bind-img="p1SquareA" alt="" />
              </article>

              <article
                class="widget image-square image-only-widget"
                data-widget-id="p1SquareB"
                style="grid-column: 4 / 5; grid-row: 4 / 5"
              >
                <img data-bind-img="p1SquareB" alt="" />
              </article>

              <article
                class="widget image-square image-only-widget"
                data-widget-id="p1SquareC"
                style="grid-column: 3 / 4; grid-row: 5 / 6"
              >
                <img data-bind-img="p1SquareC" alt="" />
              </article>

              <article
                class="widget image-square image-only-widget"
                data-widget-id="p1SquareD"
                style="grid-column: 4 / 5; grid-row: 5 / 6"
              >
                <img data-bind-img="p1SquareD" alt="" />
              </article>

              <!-- 第一页 APP -->
              <button
                class="app-icon"
                style="grid-column: 1; grid-row: 6"
                data-app="chat"
              >
                <span class="icon-bubble" data-line-icon="chat"></span>
                <em>chat</em>
              </button>

              <button
                class="app-icon"
                style="grid-column: 2; grid-row: 6"
                data-app="worldbook"
              >
                <span class="icon-bubble" data-line-icon="book"></span>
                <em>世界书</em>
              </button>

              <button
                class="app-icon"
                style="grid-column: 3; grid-row: 6"
                data-app="treehole"
              >
                <span class="icon-bubble" data-line-icon="moon"></span>
                <em>树洞</em>
              </button>

              <button
                class="app-icon"
                style="grid-column: 4; grid-row: 6"
                data-app="rolecard"
              >
                <span class="icon-bubble" data-line-icon="card"></span>
                <em>角色卡</em>
              </button>
            </div>
          </section>

          <section class="page page-two" data-page="1">
            <div class="grid second-page-grid">
              <!-- 顶部时钟组件：比上一版更高一点 -->
              <article
                class="widget dark-clock-widget editable-widget"
                data-widget-id="p2Clock"
                style="grid-column: 1 / 5; grid-row: 1 / 3"
              >
                <div>
                  <span class="today" data-bind-title="p2Clock">未设置</span>
                  <h2 data-bind-subtitle="p2Clock">未设置</h2>
                  <p data-bind-text="p2Clock">未设置</p>
                </div>
                <div class="big-time" id="bigTime">15:22</div>
                <div class="date-text" id="dateText">未设置</div>
              </article>

              <!-- 左侧媒体组件 -->
              <article
                class="widget media-widget editable-widget"
                data-widget-id="p2Media"
                style="grid-column: 1 / 3; grid-row: 3 / 5"
              >
                <h3 data-bind-title="p2Media">未设置</h3>
                <img data-bind-img="p2Media" alt="" />
                <p data-bind-text="p2Media">未设置</p>
              </article>

              <!-- 第二页 APP -->
              <button
                class="app-icon dark-app"
                style="grid-column: 3; grid-row: 3"
                data-app="home"
              >
                <span class="icon-bubble" data-line-icon="home"></span>
                <em>home</em>
              </button>

              <button
                class="app-icon dark-app"
                style="grid-column: 4; grid-row: 3"
                data-app="listen"
              >
                <span class="icon-bubble" data-line-icon="music"></span>
                <em>一起听</em>
              </button>

              <button
                class="app-icon dark-app"
                style="grid-column: 3; grid-row: 4"
                data-app="fans"
              >
                <span class="icon-bubble" data-line-icon="heart"></span>
                <em>同好</em>
              </button>

              <button
                class="app-icon dark-app"
                style="grid-column: 4; grid-row: 4"
                data-app="travel"
              >
                <span class="icon-bubble" data-line-icon="arrow"></span>
                <em>出行</em>
              </button>

              <!-- 底部记录组件：向下吃掉空白 -->
              <article
                class="widget record-widget editable-widget"
                data-widget-id="p2Record"
                style="grid-column: 1 / 5; grid-row: 5 / 7"
              >
                <div class="polaroid one">
                  <img data-bind-img="p2RecordA" alt="" />
                </div>

                <div class="polaroid two">
                  <img data-bind-img="p2RecordB" alt="" />
                </div>

                <div class="record-date">
                  <span data-bind-title="p2Record">未设置</span>
                  <strong data-bind-subtitle="p2Record">未设置</strong>
                </div>

                <p class="record-text" data-bind-text="p2Record">未设置</p>
              </article>
            </div>
          </section>
        </div>
      </section>

      <!-- 分页点 -->
      <nav class="page-dots" aria-label="分页">
        <button class="dot active" data-jump="0"></button>
        <button class="dot" data-jump="1"></button>
      </nav>

      <!-- Dock -->
      <footer class="dock">
        <button class="dock-app" data-app="api">
          <span data-line-icon="settings"></span>
          <em>api设置</em>
        </button>

        <button class="dock-app" data-app="widgets">
          <span data-line-icon="widgets"></span>
          <em>小组件</em>
        </button>

        <button class="dock-app" data-app="beautify">
          <span data-line-icon="bow"></span>
          <em>美化</em>
        </button>
      </footer>

      <!-- APP 弹窗 -->
      <dialog id="appDialog" class="app-dialog">
        <form method="dialog">
          <h3 id="dialogTitle">APP</h3>
          <p>这里可以接入你的真实页面。</p>
          <button>关闭</button>
        </form>
      </dialog>

      <!-- 小组件编辑弹窗 -->
      <dialog id="widgetEditor" class="widget-editor">
        <form id="widgetEditorForm" method="dialog">
          <h3>编辑小组件</h3>

          <input type="hidden" id="editWidgetId" />

          <label>
            标题
            <input id="editTitle" type="text" placeholder="未设置" />
          </label>

          <label>
            副标题
            <input id="editSubtitle" type="text" placeholder="未设置" />
          </label>

          <label>
            正文
            <textarea id="editText" rows="3" placeholder="未设置"></textarea>
          </label>

          <label>
            图片
            <input id="editImage" type="file" accept="image/*" />
          </label>

          <div class="editor-preview">
            <img id="editPreview" alt="" />
          </div>

          <div class="editor-actions">
            <button type="button" id="clearWidget">清空</button>
            <button type="button" id="saveWidget">保存</button>
            <button type="button" id="closeEditor">关闭</button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="./app.js?v=bottom-fix-1"></script>
  </body>
</html>
